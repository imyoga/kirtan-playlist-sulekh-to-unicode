<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{OG_TITLE}}</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:url" content="{{OG_URL}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/items.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body data-slug="{{SLUG}}" data-not-found="{{NOT_FOUND}}" class="playlist-shell">
  <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

  <div class="playlist-layout">
    <aside id="playlist-sidebar" class="playlist-sidebar" aria-label="Playlist contents">
      <div class="sidebar-header">
        <span class="sidebar-header-label">Kirtan</span>
        <span id="sidebar-item-count" class="sidebar-count" aria-label="0 kirtan">0</span>
      </div>
      <p id="nav-empty" class="nav-empty">Add items to see them here.</p>
      <ul id="nav-list" class="nav-list"></ul>
    </aside>

    <div class="playlist-main">
      <header class="page-header">
        <button type="button" id="sidebar-toggle" class="icon-btn sidebar-toggle" aria-label="Open contents" aria-expanded="false" aria-controls="playlist-sidebar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <a href="/" class="nav-link">Home</a>
        <div class="header-actions">
          <button type="button" id="add-item-btn" class="icon-btn" title="Add item" aria-label="Add item">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </header>
      <div id="not-found" class="not-found hidden">Playlist not found.</div>
      <ul id="items-list" class="items-list"></ul>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script type="module" src="/js/playlist.js"></script>
</body>
</html>
