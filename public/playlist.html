<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{OG_TITLE}}</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:url" content="{{OG_URL}}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{OG_TITLE}}">
  <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/items.css">
  <link rel="stylesheet" href="/css/groups.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/playlist-header.css">
  <link rel="stylesheet" href="/css/toast.css">
  <link rel="stylesheet" href="/css/dialog.css">
</head>
<body data-slug="{{SLUG}}" data-not-found="{{NOT_FOUND}}" class="playlist-shell">
  <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

  <!-- Top app bar: navigation (left) and global actions (right) -->
  <header class="app-header">
    <div class="app-header-start">
      <button type="button" id="sidebar-toggle" class="icon-btn sidebar-toggle" aria-label="Open contents" aria-expanded="false" aria-controls="playlist-sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
      <a href="/" target="_blank" rel="noopener noreferrer" class="nav-link" title="Open home page in new tab" aria-label="Home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
        </span>
        <span class="brand-name">Home</span>
      </a>
      <svg class="header-sep" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      <div class="playlist-title-row">
        <h1 id="display-title" class="playlist-title" title="Click to rename" tabindex="0">{{PLAYLIST_TITLE}}</h1>
        <button type="button" id="edit-title-btn" class="icon-btn" aria-label="Rename playlist" title="Rename">
          <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15" aria-hidden="true">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" id="share-btn" class="btn-share" title="Share playlist">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/>
        </svg>
        <span>Share</span>
      </button>
    </div>
  </header>

  <div class="app-body">
    <!-- Left: table of contents -->
    <aside id="playlist-sidebar" class="playlist-sidebar" aria-label="Playlist contents">
      <div class="sidebar-header">
        <span class="sidebar-header-label">Contents</span>
        <span id="sidebar-item-count" class="sidebar-count" aria-label="0 kirtan">0</span>
      </div>
      <p id="nav-empty" class="nav-empty">Add items to see them here.</p>
      <ul id="nav-list" class="nav-list"></ul>
    </aside>

    <!-- Center: readable column -->
    <main class="playlist-main">
      <div class="content">
        <div id="not-found" class="not-found hidden">Playlist not found.</div>

        <div id="groups-container" class="groups-container"></div>

        <div class="add-group-bar">
          <button type="button" id="show-add-group-btn" class="btn-add-group">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Add group
          </button>
          <form id="add-group-form" class="add-group-form hidden" autocomplete="off">
            <input type="text" id="add-group-input" class="add-group-input" placeholder="Group name" maxlength="80" aria-label="Group name" />
            <button type="submit" class="btn-add-group-submit">Add</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script type="module" src="/js/playlist.js"></script>
</body>
</html>
