<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{OG_TITLE}}</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:url" content="{{OG_URL}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/items.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body data-slug="{{SLUG}}" data-not-found="{{NOT_FOUND}}">
  <div class="page">
    <header class="page-header">
      <a href="/" class="nav-link">Home</a>
      <button type="button" id="add-item-btn" class="icon-btn" title="Add item" aria-label="Add item">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div id="not-found" class="not-found hidden">Playlist not found.</div>
    <ul id="items-list" class="items-list"></ul>
  </div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script type="module" src="/js/playlist.js"></script>
</body>
</html>
